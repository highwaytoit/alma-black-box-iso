---
name: Build Alma Black Box installer ISO

on:
  workflow_dispatch:
    inputs:
      bootc_image:
        description: Bootc image to install
        required: true
        default: ghcr.io/highwaytoit/alma-black-box:10
        type: string
      verify_signature:
        description: Verify the selected image with cosign.pub
        required: true
        default: true
        type: boolean
      enable_password_login:
        description: Enable bbox password login (default password bbox)
        required: true
        default: true
        type: boolean
      install_ssh_key:
        description: Install SSH public key from SSH_PUBLIC_KEY secret
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest
  INSTALLER_IMAGE: localhost/alma-black-box-installer:10

jobs:
  build-installer:
    name: Build unattended UEFI installer
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate access options
        shell: bash
        env:
          ENABLE_PASSWORD_LOGIN: ${{ inputs.enable_password_login }}
          INSTALL_SSH_KEY: ${{ inputs.install_ssh_key }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          if [[ "${ENABLE_PASSWORD_LOGIN}" != "true" && "${INSTALL_SSH_KEY}" != "true" ]]; then
            echo 'ERROR: The installer would create no usable login method.'
            echo 'Enable bbox password login, install an SSH public key, or enable both.'
            exit 1
          fi

          if [[ "${INSTALL_SSH_KEY}" == "true" && -z "${SSH_PUBLIC_KEY:-}" ]]; then
            echo 'ERROR: Install SSH public key is enabled, but repository secret SSH_PUBLIC_KEY is missing or empty.'
            echo 'Add the public key under Settings -> Secrets and variables -> Actions, then run the workflow again.'
            exit 1
          fi

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Install verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq skopeo openssh-client openssl

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Prepare installer access configuration
        shell: bash
        env:
          ENABLE_PASSWORD_LOGIN: ${{ inputs.enable_password_login }}
          INSTALL_SSH_KEY: ${{ inputs.install_ssh_key }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          runtime_config="${PWD}/installer/runtime-iso.toml"
          cp installer/iso.toml "${runtime_config}"

          normalized_key=''
          if [[ "${INSTALL_SSH_KEY}" == "true" ]]; then
            key_file="${RUNNER_TEMP}/bbox-ssh-key.pub"
            printf '%s\n' "${SSH_PUBLIC_KEY}" > "${key_file}"

            # Validate the supplied OpenSSH public key before starting the long build.
            ssh-keygen -l -f "${key_file}" >/dev/null

            read -r key_type key_data _ < "${key_file}"
            if [[ -z "${key_type:-}" || -z "${key_data:-}" ]]; then
              echo 'ERROR: SSH_PUBLIC_KEY is not a complete OpenSSH public key.'
              exit 1
            fi
            normalized_key="${key_type} ${key_data}"
          fi

          disabled_password_hash=''
          if [[ "${ENABLE_PASSWORD_LOGIN}" != "true" ]]; then
            random_password="$(openssl rand -base64 48)"
            disabled_password_hash="$(printf '%s' "${random_password}" | openssl passwd -6 -stdin)"
            unset random_password
          fi

          export RUNTIME_CONFIG="${runtime_config}"
          export NORMALIZED_SSH_PUBLIC_KEY="${normalized_key}"
          export DISABLED_PASSWORD_HASH="${disabled_password_hash}"

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["RUNTIME_CONFIG"])
          text = path.read_text()

          user_pattern = re.compile(r'^user --name=bbox --groups=wheel(?: .*)?$', re.MULTILINE)
          matches = user_pattern.findall(text)
          if len(matches) != 1:
              raise SystemExit("ERROR: installer/iso.toml must contain exactly one bbox user line")

          default_password_hash = "$6$BZqInxNMN2BtLMOO$6UQrru8JMxnH5ls4X4IwYARw1xDXyUjeil85ZTwqXErenaG0vWLt6Tat6WDXuPLozTGQ84oWYPvaahzJTeEpq."
          password_enabled = os.environ["ENABLE_PASSWORD_LOGIN"] == "true"
          ssh_enabled = os.environ["INSTALL_SSH_KEY"] == "true"

          if password_enabled:
              password_hash = default_password_hash
          else:
              password_hash = os.environ["DISABLED_PASSWORD_HASH"]
              if not password_hash:
                  raise SystemExit("ERROR: disabled password hash is empty")

          user_line = f"user --name=bbox --groups=wheel --password={password_hash} --iscrypted"
          text = user_pattern.sub(user_line, text, count=1)
          text = re.sub(r'^sshkey --username=bbox .*\n?', '', text, flags=re.MULTILINE)

          if ssh_enabled:
              key = os.environ["NORMALIZED_SSH_PUBLIC_KEY"]
              if not key:
                  raise SystemExit("ERROR: normalized SSH public key is empty")
              text = text.replace(
                  user_line,
                  f'{user_line}\nsshkey --username=bbox "{key}"',
                  1,
              )

          path.write_text(text)
          PY

          echo 'Installer access configuration prepared successfully.'

      - name: Resolve selected bootc image
        id: source
        shell: bash
        env:
          BOOTC_IMAGE: ${{ inputs.bootc_image }}
          VERIFY_SIGNATURE: ${{ inputs.verify_signature }}
        run: |
          set -euo pipefail

          if [[ -z "${BOOTC_IMAGE}" ]]; then
            echo 'bootc_image cannot be empty.'
            exit 1
          fi

          inspect="$(skopeo inspect \
            --override-arch amd64 \
            "docker://${BOOTC_IMAGE}")"

          name="$(jq -r '.Name' <<<"${inspect}")"
          digest="$(jq -r '.Digest' <<<"${inspect}")"

          [[ -n "${name}" && "${name}" != "null" ]]
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

          ref="${name}@${digest}"

          if [[ "${VERIFY_SIGNATURE}" == "true" ]]; then
            cosign verify \
              --new-bundle-format=false \
              --key cosign.pub \
              "${ref}" >/tmp/bootc-image-verify.json
            jq -e 'length > 0' /tmp/bootc-image-verify.json >/dev/null
            echo "Verified installer payload: ${ref}"
          else
            echo "WARNING: signature verification disabled for ${ref}"
          fi

          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Prepare rootful Podman storage
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          sudo tee /etc/containers/storage.conf >/dev/null <<'EOF'
          [storage]
          driver = "overlay"
          runroot = "/run/containers/storage"
          graphroot = "/var/lib/containers/storage"
          EOF

      - name: Build dedicated installer container
        shell: bash
        run: |
          set -euo pipefail
          sudo podman build \
            --pull=always \
            --file installer/Containerfile \
            --tag "${INSTALLER_IMAGE}" \
            .

      - name: Pull payload and image builder
        shell: bash
        env:
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          set -euo pipefail
          sudo podman pull "${SOURCE_REF}"
          sudo podman pull "${BIB_IMAGE}"

      - name: Build bootc installer ISO
        shell: bash
        env:
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p output

          sudo podman run --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume "${PWD}/output:/output" \
            --volume "${PWD}/installer/runtime-iso.toml:/config.toml:ro" \
            "${BIB_IMAGE}" build \
            --output /output \
            --type bootc-installer \
            --installer-payload-ref "${SOURCE_REF}" \
            "${INSTALLER_IMAGE}"

      - name: Prepare downloadable ISO
        shell: bash
        run: |
          set -euo pipefail

          iso_path="$(find ./output -type f -name '*.iso' -print -quit)"
          if [[ -z "${iso_path}" || ! -f "${iso_path}" ]]; then
            echo 'Installer ISO was not produced.'
            exit 1
          fi

          mkdir -p installer-artifact
          cp "${iso_path}" installer-artifact/alma-black-box-installer.iso
          (
            cd installer-artifact
            sha256sum alma-black-box-installer.iso > SHA256SUMS
          )

      - name: Upload installer ISO
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alma-black-box-installer
          path: installer-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

      - name: Installer summary
        shell: bash
        env:
          SOURCE_NAME: ${{ steps.source.outputs.name }}
          SOURCE_DIGEST: ${{ steps.source.outputs.digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ENABLE_PASSWORD_LOGIN: ${{ inputs.enable_password_login }}
          INSTALL_SSH_KEY: ${{ inputs.install_ssh_key }}
        run: |
          if [[ "${ENABLE_PASSWORD_LOGIN}" == "true" ]]; then
            password_status='enabled (bbox / bbox)'
          else
            password_status='disabled; no known password'
          fi

          if [[ "${INSTALL_SSH_KEY}" == "true" ]]; then
            ssh_status='installed for bbox'
          else
            ssh_status='not installed'
          fi

          {
            echo '## Alma Black Box installer ISO'
            echo
            echo "### [Download installer artifact](${ARTIFACT_URL})"
            echo
            echo '> The artifact expires after 1 day. Run this workflow again if it has expired.'
            echo
            echo "- Source image: ${SOURCE_NAME}"
            echo "- Resolved digest: ${SOURCE_DIGEST}"
            echo "- Signature verification: ${{ inputs.verify_signature }}"
            echo "- bbox password login: ${password_status}"
            echo "- SSH public key: ${ssh_status}"
            echo '- bbox groups: wheel'
            echo '- Root login: locked'
            echo '- Installer type: bootc-installer with embedded Anaconda/Lorax environment'
            echo '- Firmware target: UEFI x86_64'
            echo '- Partition table: GPT'
            echo '- EFI system partition: 512 MiB'
            echo '- /boot: 1 GiB XFS'
            echo '- /: XFS using remaining disk space (8 GiB minimum)'
            echo '- Swap: none'
            echo
            echo '> **DANGER:** Disconnect every non-target disk before using this unattended installer on physical hardware.'
          } >> "${GITHUB_STEP_SUMMARY}"
